# Reconstructed Stage-3 LoRA config (Phase B2).
#
# `lora:` comes directly from the shipped ml/smolvlm/lora_stage3/adapter_config.json
# (v1.0, mystery provenance) — real, not guessed. The v1.0 adapter's own README.md
# is an unfilled HF PEFT template; no training log exists for it, so `training:`
# (v1.0) fields are honestly marked unknown rather than invented.
#
# `training_v2:` is the REAL, verifiable config for the retrained v2.0 adapter
# (ml/smolvlm/lora_stage3_v2/) trained by ml/adaptation/train_lora.py on the
# dataset built by ml/adaptation/prepare_bigearthnet_vqa.py from official
# BigEarthNet v2.0 labels (Zenodo metadata.parquet, CDLA-Permissive-1.0),
# matched to the local testing/ imagery (4008/4011 patches). Full proof lives
# in ml/smolvlm/lora_stage3_v2/training_log.json.

model:
  base_model: HuggingFaceTB/SmolVLM-256M-Instruct
  architecture_note: >
    LoRA is applied to a CausalLM-facade wrapper (DecoderShim in
    model_provider.py) over Idefics3's text decoder only — the vision
    tower is untouched. See model_provider.py for why this shape is
    required (PEFT needs a plain CausalLM-like forward()).

lora:
  r: 8
  lora_alpha: 16
  lora_dropout: 0.1
  bias: none
  task_type: CAUSAL_LM
  target_modules: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]
  # source: ml/smolvlm/lora_stage3/adapter_config.json (verbatim)

training:
  # v1.0 (mystery provenance). Honest unknowns, NOT guesses.
  dataset: unknown  # narrative claims "~64-example BigEarthNet slice" (unverifiable)
  learning_rate: unknown
  steps: unknown
  batch_size: unknown
  gradient_accumulation_steps: unknown
  seed: unknown
  precision: unknown
  image_size: unknown
  hardware: unknown  # "T600 ~4GB VRAM" documented for INFERENCE only, not training

version_string: smolvlm256m-ben-lora-s3-v1.0

training_v2:
  # v2.0 (real, verifiable). Used by ml/adaptation/train_lora.py.
  dataset: ml/adaptation/dataset/{train,val,test}.jsonl (prepare_bigearthnet_vqa.py)
  epochs: 3
  max_train_rows: 2400
  batch_size: 2
  gradient_accumulation_steps: 8
  effective_batch_size: 16
  learning_rate: 0.0002
  warmup_frac: 0.05
  seed: 42
  precision: fp16
  image_size: 120x120  # native BigEarthNet patch; processor resizes internally
  hardware: NVIDIA GeForce RTX 2050 (4096 MiB VRAM), CUDA

version_string_v2: smolvlm256m-ben-lora-s3-v2.0